<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wissahickon Outfitters | Opening soon</title>
<meta name="description" content="Camp and trail gear, designed and 3D-printed in small batches. Wissahickon Outfitters is opening soon.">
<meta name="theme-color" content="#d7dcd8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101a14" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:url" content="https://wissahickonoutfitters.com/">
<meta property="og:title" content="Wissahickon Outfitters">
<meta property="og:description" content="Camp and trail gear, designed and 3D-printed in small batches. Opening soon.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='11' y='3' width='10' height='26' rx='1' fill='%23ff5a00'/%3E%3C/svg%3E">
<style>
  :root {
    --ground: #d7dcd8;   /* Wissahickon schist */
    --ink: #101c15;      /* hemlock shade */
    --muted: #46534b;
    --blaze: #ff5a00;    /* trail-blaze paint */
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #101a14; --ink: #e6ebe7; --muted: #9aa79f; --blaze: #ff6a1a; }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: 1fr auto;
    background: var(--ground);
    color: var(--ink);
    font: 1.25rem/1.55 ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  }

  main {
    align-self: center;
    padding: 10vh clamp(16px, 6vw, 96px);
  }

  .head {
    display: flex;
    gap: .22em;
    font-size: min(12vw, 8.5rem);
    line-height: .95;
  }

  h1 {
    margin: 0;
    min-width: 0;
    font: 800 1em/.95 "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
    letter-spacing: -.01em;
  }

  /* One painted blaze, 1:3 like the real 2x6 inch ones, edges roughened by the SVG filter below. */
  .blaze {
    flex: none;
    width: .6em;
    background: var(--blaze);
    filter: url(#rough);
    animation: paint 1.1s .15s cubic-bezier(.3, .7, .2, 1) both;
  }
  @keyframes paint {
    from { clip-path: inset(0 0 100% 0); }
    to   { clip-path: inset(0); }
  }

  .text { max-width: 34rem; margin-top: clamp(24px, 5vh, 56px); }
  .text p { margin: 0 0 1rem; }
  .soon { font-size: 2rem; font-style: italic; line-height: 1.2; }

  a { color: inherit; text-decoration-color: var(--blaze); text-decoration-thickness: .14em; text-underline-offset: .18em; }
  a:hover { text-decoration-thickness: .26em; }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  footer { padding: 16px clamp(16px, 6vw, 96px) 24px; font-size: .9rem; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .blaze { animation: none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <filter id="rough" x="-20%" y="-5%" width="140%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
  </filter>
</svg>

<main>
  <div class="head">
    <span class="blaze" aria-hidden="true"></span>
    <h1>Wissahickon<br>Outfitters</h1>
  </div>
  <div class="text">
    <p class="soon">Opening soon.</p>
    <p>Camp and trail gear, designed and 3D-printed in small batches by two friends.</p>
    <p>Want to hear when we open? Write to <a href="mailto:hello@wissahickonoutfitters.com">hello@wissahickonoutfitters.com</a>.</p>
  </div>
</main>

<footer>&copy; 2026 Wissahickon Outfitters</footer>
</body>
</html>
